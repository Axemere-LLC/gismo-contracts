name: Release

# Gated: the "Publish GitHub Release" step only runs when the
# RELEASE_PUBLISH_ENABLED repo variable is set to "true" AND this isn't a
# workflow_dispatch dry run. RELEASE_PUBLISH_ENABLED is unset until the
# reveal decision, so the gate is closed by default — a stray `v*` tag push
# builds and signs the bundle but stops short of publishing. See
# gismo-platform/docs/phase-7-supply-chain.md.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build and sign, but skip the publish step"
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write # required for keyless Sigstore signing
  attestations: write

jobs:
  publish-contract-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build versioned contract bundle
        run: |
          mkdir -p dist
          tar -czf "dist/gismo-contracts-${GITHUB_REF_NAME}.tar.gz" openapi mcp-schema

      - name: Attach Sigstore build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "dist/gismo-contracts-*.tar.gz"

      - name: Publish GitHub Release
        if: vars.RELEASE_PUBLISH_ENABLED == 'true' && github.event.inputs.dry_run != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/gismo-contracts-*.tar.gz
          generate_release_notes: true
