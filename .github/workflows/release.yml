name: Release

# Inert until the reveal milestone: this repo is private and no tag has been
# pushed. Do not push a `v*` tag before the reveal decision — see
# gismo-platform/docs/phase-7-supply-chain.md.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write # required for keyless Sigstore signing
  attestations: write

jobs:
  publish-contract-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build versioned contract bundle
        run: |
          mkdir -p dist
          tar -czf "dist/gismo-contracts-${GITHUB_REF_NAME}.tar.gz" openapi mcp-schema

      - name: Attach Sigstore build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "dist/gismo-contracts-*.tar.gz"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/gismo-contracts-*.tar.gz
          generate_release_notes: true
